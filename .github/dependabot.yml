# Dependabot version updates.
# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Everything is a devDependency (the extension has no runtime deps), so
      # batch minor/patch bumps into one PR instead of one per package.
      dev-dependencies:
        dependency-type: "development"
        update-types: ["minor", "patch"]
    ignore:
      # Must not exceed engines.vscode (^1.96.0) or `vsce package` fails.
      # Bump it by hand together with the engine.
      - dependency-name: "@types/vscode"
      # Tracks the Node 24 toolchain (.nvmrc); majors move with it.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"
    groups:
      actions:
        patterns: ["*"]
